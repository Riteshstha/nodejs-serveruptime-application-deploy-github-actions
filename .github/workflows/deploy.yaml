name: Deploy NodeJS Application to hostinger

on:
  push:
    branches:
      -main
 
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_PUB }}
          username: ritesh
          key: ${{ secrets.SSH_KEY }}
          scripts: |
            cd ~/nodejs-serveruptime-application-deploy-github-actions
            git pull 
            docker compose up -d --build
