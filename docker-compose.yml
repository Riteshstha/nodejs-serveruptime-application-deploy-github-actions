services:
  app:                      # must match the name used in proxy_pass in nginx.conf
    build: .
    restart: unless-stopped
    # no ports needed anymore

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app